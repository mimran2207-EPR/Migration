<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שקף הזהב — מסלול מקצה לקצה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1e1b4b; --muted:#475569; --plan:#4338ca; --verify:#d97706; --undef:#dc2626; --bg:#f8fafc; }
  html,body { margin:0; background:var(--bg); font-family:Heebo,Arial,sans-serif; color:var(--ink); }
  .wrap { width:1600px; height:900px; margin:0 auto; }
  svg { display:block; width:100%; height:100%; }
  svg text { font-family:Heebo,Arial,sans-serif; }
  @media (max-width: 1600px) { .wrap { width:100vw; height:56.25vw; } }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" direction="rtl">
  <defs>
    <marker id="a-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
    <marker id="a-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="a-built" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="a-undef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <style>
      .zone { fill:none; stroke-width:2; stroke-dasharray:8 6; rx:22; }
      .zlabel { font-size:17px; font-weight:800; }
      .box { fill:#fff; stroke:#cbd5e1; stroke-width:2; rx:14; }
      .box.key { stroke:#4338ca; }
      .box.undef { stroke:#dc2626; stroke-dasharray:6 5; fill:#fef2f2; }
      .t1 { font-size:17px; font-weight:800; fill:#1e1b4b; text-anchor:middle; }
      .t2 { font-size:13.5px; fill:#475569; text-anchor:middle; }
      .plan { stroke:#4338ca; stroke-width:3; fill:none; marker-end:url(#a-plan); }
      .verify { stroke:#d97706; stroke-width:3; fill:none; stroke-dasharray:9 6; marker-end:url(#a-verify); }
      .built { stroke:#059669; stroke-width:3.5; fill:none; marker-end:url(#a-built); }
      .lbl.b { fill:#065f46; font-weight:600; }
      .undef { stroke:#dc2626; stroke-width:3; fill:none; stroke-dasharray:3 5; marker-end:url(#a-undef); }
      .num circle { stroke:#fff; stroke-width:2; }
      .num text { font-size:15px; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:central; }
      .lbl { font-size:13px; fill:#1e1b4b; text-anchor:middle; }
      .lbl.v { fill:#92400e; } .lbl.u { fill:#991b1b; }
    </style>
  </defs>

  <!-- title -->
  <text x="800" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="#1e1b4b">שקף הזהב — "הפקת שובר לחייב" מקצה לקצה</text>
  <text x="800" y="64" text-anchor="middle" font-size="15" fill="#b45309" font-weight="600">דוגמה להמחשה — התהליך האמיתי ייבחר מול בעלי המערכת. בירוק: מה שכבר קיים בקוד (כרטיס משלם, קריאה בלבד).</text>

  <!-- zones -->
  <g id="z-local"><rect class="zone" x="1235" y="85" width="350" height="290" stroke="#0891b2"/><text class="zlabel" x="1565" y="112" fill="#0e7490" text-anchor="start">מחשב המשתמש</text></g>
  <g id="z-cloud"><rect class="zone" x="440" y="85" width="770" height="800" stroke="#4338ca"/><text class="zlabel" x="1190" y="112" fill="#4338ca" text-anchor="start">AWS Cloud</text></g>
  <g id="z-tenant"><rect class="zone" x="15" y="300" width="400" height="230" stroke="#7c3aed"/><text class="zlabel" x="395" y="490" fill="#6d28d9" text-anchor="start">נתוני הרשות (Tenant)</text>
    <text x="215" y="515" text-anchor="middle" font-size="12.5" fill="#92400e">מיקום ה־VMs (ענן / מקומי): נדרש אימות מול הארכיטקט</text></g>
  <g id="z-legacy"><rect class="zone" x="15" y="85" width="400" height="190" stroke="#64748b"/><text class="zlabel" x="395" y="112" fill="#475569" text-anchor="start">המערכת הקיימת (בתקופת המעבר)</text></g>

  <!-- boxes -->
  <g id="b-user"><rect class="box" x="1290" y="125" width="270" height="70"/><text class="t1" x="1425" y="155">👤 משתמש הגבייה</text><text class="t2" x="1425" y="180">"מצא חייב → הפק שובר"</text></g>
  <g id="b-angular"><rect class="box key" x="1290" y="250" width="270" height="100"/><text class="t1" x="1425" y="285">🌐 דפדפן · Angular</text><text class="t2" x="1425" y="310">מסכים בלבד: חיפוש, כפתור, סטטוס</text><text class="t2" x="1425" y="332">אין כללים עסקיים</text></g>

  <g id="b-bff"><rect class="box key" x="905" y="250" width="270" height="100"/><text class="t1" x="1040" y="282">🚪 Thin BFF</text><text class="t2" x="1040" y="306">ASP.NET Core · .NET 10</text><text class="t2" x="1040" y="328">אימות · Tenant · ניתוב — בלי לוגיקה עסקית</text></g>
  <g id="b-billing"><rect class="box key" x="470" y="150" width="300" height="90"/><text class="t1" x="620" y="182">⚙️ שירות גבייה (Backend)</text><text class="t2" x="620" y="206">ECS Fargate · כאן חיים הכללים העסקיים</text><text class="t2" x="620" y="226" style="fill:#065f46">קיים: Gvia.BillingService (קריאה)</text></g>
  <g id="b-control"><rect class="box" x="470" y="275" width="300" height="70"/><text class="t1" x="620" y="303">🧭 RDS PostgreSQL · Control Plane</text><text class="t2" x="620" y="327">איזו רשות · איזה מסד · הרשאות — לא נתונים עסקיים</text></g>
  <g id="b-queue"><rect class="box key" x="905" y="440" width="270" height="80"/><text class="t1" x="1040" y="472">📬 SQS / SNS</text><text class="t2" x="1040" y="497">תור משימות ארוכות</text></g>
  <g id="b-worker"><rect class="box key" x="470" y="440" width="300" height="90"/><text class="t1" x="620" y="472">🛠️ Worker מסמכים (Backend)</text><text class="t2" x="620" y="496">ECS Fargate · מפיק את השובר ברקע</text><text class="t2" x="620" y="516">שם השירות: הצעה</text></g>
  <g id="b-status"><rect class="box undef" x="905" y="580" width="270" height="80"/><text class="t1" x="1040" y="610" style="fill:#991b1b">❓ סטטוס המשימה</text><text class="t2" x="1040" y="634" style="fill:#991b1b">איפה נשמר ואיך מגיע למסך — לא מוגדר</text></g>

  <g id="b-legacy"><rect class="box" x="30" y="125" width="180" height="125"/><text class="t1" x="120" y="157">🗄️ Access + VBA</text><text class="t2" x="120" y="181">RDP ושרת Terminal</text><text class="t2" x="120" y="203">ממשיך לעבוד</text><text class="t2" x="120" y="225">במקביל בגל 2</text></g>
  <g id="b-iis"><rect class="box" x="225" y="125" width="180" height="125"/><text class="t1" x="315" y="157">🖥️ שרתי IIS</text><text class="t2" x="315" y="181">אתרים ו־Web Services</text><text class="t2" x="315" y="203">קיימים (asmx)</text><text class="t2" x="315" y="225" style="fill:#92400e">רשימה מלאה: ⚠️ לאמת</text></g>
  <g id="b-sql"><rect class="box key" x="60" y="345" width="310" height="100"/><text class="t1" x="215" y="378">🗄️ SQL Server על VM</text><text class="t2" x="215" y="402">מסד הנתונים של הרשות</text><text class="t2" x="215" y="424">460 פרוצדורות · 20 טריגרים · 733 טבלאות</text></g>

  <!-- support services: separated from the request flow -->
  <g id="b-support"><rect x="460" y="705" width="730" height="160" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="478" y="732" text-anchor="end" font-size="16" font-weight="800" fill="#3730a3">שירותי תמיכה (לא חלק מזרימת הבקשה)</text>
    <g id="b-s3"><rect class="box" x="975" y="750" width="195" height="95"/><text class="t1" x="1072" y="783">🪣 S3</text><text class="t2" x="1072" y="806">קובצי השוברים (PDF)</text><text class="t2" x="1072" y="826">הורדה בקישור זמני</text></g>
    <g id="b-redis"><rect class="box" x="760" y="750" width="195" height="95"/><text class="t1" x="857" y="783">⚡ Redis</text><text class="t2" x="857" y="806">מטמון: הגדרות רשות</text><text class="t2" x="857" y="826">עותק בלבד, לא מקור אמת</text></g>
    <g id="b-secrets"><rect class="box" x="480" y="750" width="260" height="95"/><text class="t1" x="610" y="783">🔑 Secrets Manager</text><text class="t2" x="610" y="806">סיסמאות ומחרוזות חיבור</text><text class="t2" x="610" y="826">השירותים קוראים בזמן ריצה</text></g>
  </g>

  <!-- ===== arrows ===== -->
  <!-- short request: 1–5 -->
  <g id="arrow-1"><path class="built" d="M1425,195 L1425,248"/><g class="num"><circle cx="1448" cy="221" r="13" fill="#059669"/><text x="1448" y="221">1</text></g><text class="lbl b" x="1515" y="226">פעולה במסך</text></g>
  <g id="arrow-2"><path class="built" d="M1290,280 L1177,280"/><g class="num"><circle cx="1233" cy="280" r="13" fill="#059669"/><text x="1233" y="280">2</text></g><text class="lbl b" x="1233" y="258">חיפוש · סינכרוני</text></g>
  <g id="arrow-3"><path class="built" d="M905,265 C840,250 820,225 772,212"/><g class="num"><circle cx="845" cy="232" r="13" fill="#059669"/><text x="845" y="232">3</text></g><text class="lbl b" x="840" y="200">קריאה פנימית · HTTP</text></g>
  <g id="arrow-4"><path class="plan" d="M600,240 L600,273"/><g class="num"><circle cx="578" cy="257" r="13" fill="#4338ca"/><text x="578" y="257">4</text></g><text class="lbl" x="530" y="262">איזה מסד?</text></g>
  <g id="arrow-5"><path class="built" d="M470,200 C420,210 400,300 372,350"/><g class="num"><circle cx="425" cy="250" r="13" fill="#059669"/><text x="425" y="250">5</text></g><text class="lbl b" x="455" y="285" text-anchor="start">SQL · קריאה</text></g>

  <!-- long operation: 6–13 -->
  <g id="arrow-6"><path class="plan" d="M1290,325 L1177,325"/><g class="num"><circle cx="1233" cy="325" r="13" fill="#4338ca"/><text x="1233" y="325">6</text></g><text class="lbl" x="1233" y="356">הפקה → מס׳ משימה</text></g>
  <g id="arrow-7"><path class="verify" d="M1040,350 L1040,438"/><g class="num"><circle cx="1063" cy="394" r="13" fill="#d97706"/><text x="1063" y="394">7</text></g><text class="lbl v" x="960" y="399">פרסום הודעה · אסינכרוני</text></g>
  <g id="arrow-8"><path class="plan" d="M905,480 L772,480"/><g class="num"><circle cx="838" cy="464" r="13" fill="#4338ca"/><text x="838" y="464">8</text></g><text class="lbl" x="838" y="502">משיכה מהתור</text></g>
  <g id="arrow-9"><path class="plan" d="M470,480 C430,470 400,440 372,420"/><g class="num"><circle cx="420" cy="455" r="13" fill="#4338ca"/><text x="420" y="455">9</text></g><text class="lbl" x="455" y="555" text-anchor="start">קריאה + רישום השובר</text></g>
  <g id="arrow-10"><path class="plan" d="M720,530 C760,640 960,690 1030,748"/><g class="num"><circle cx="860" cy="640" r="13" fill="#4338ca"/><text x="860" y="640">10</text></g><text class="lbl" x="790" y="668">שמירת PDF</text></g>
  <g id="arrow-11"><path class="undef" d="M770,515 C830,560 860,600 903,615"/><g class="num"><circle cx="845" cy="574" r="13" fill="#dc2626"/><text x="845" y="574">11</text></g><text class="lbl u" x="760" y="590">עדכון סטטוס</text></g>
  <g id="arrow-12"><path class="undef" d="M1177,620 C1300,600 1400,480 1410,352"/><g class="num"><circle cx="1335" cy="560" r="13" fill="#dc2626"/><text x="1335" y="560">12</text></g><text class="lbl u" x="1380" y="595">בירור / דחיפת סטטוס</text><text class="lbl u" x="1380" y="613">לא מוגדר</text></g>
  <g id="arrow-13"><path class="verify" d="M1170,790 C1350,780 1480,560 1480,352"/><g class="num"><circle cx="1440" cy="680" r="13" fill="#d97706"/><text x="1440" y="680">13</text></g><text class="lbl v" x="1460" y="715">הורדת השובר</text><text class="lbl v" x="1460" y="733">בקישור זמני</text></g>

  <!-- transition period -->
  <g id="arrow-14"><path class="verify" d="M120,252 L120,343"/><path class="verify" d="M315,252 L315,343"/><g class="num"><circle cx="143" cy="290" r="13" fill="#d97706"/><text x="143" y="290">14</text></g><text class="lbl v" x="217" y="292">עבודה במקביל</text><text class="lbl v" x="217" y="310">על אותו מסד</text></g>

  <!-- legend -->
  <g id="legend">
    <rect x="20" y="560" width="400" height="300" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="400" y="590" text-anchor="start" font-size="16" font-weight="800" fill="#1e1b4b">מקרא</text>
    <path d="M395,618 L320,618" class="plan"/><text x="305" y="623" text-anchor="start" font-size="14" fill="#1e1b4b">מופיע בתכנון הארכיטקט</text>
    <path d="M395,650 L320,650" class="verify"/><text x="305" y="655" text-anchor="start" font-size="14" fill="#92400e">בתכנון, הפרטים דורשים אימות</text>
    <path d="M395,682 L320,682" class="undef"/><text x="305" y="687" text-anchor="start" font-size="14" fill="#991b1b">לא מוגדר — אין להמציא</text>
    <path d="M395,714 L320,714" class="built"/><text x="305" y="719" text-anchor="start" font-size="14" fill="#065f46" font-weight="600">קיים בקוד — כרטיס משלם (קריאה)</text>
    <text x="395" y="752" text-anchor="start" font-size="14" font-weight="600" fill="#4338ca">1–5 בקשה קצרה · תשובה מיידית</text>
    <text x="395" y="776" text-anchor="start" font-size="14" font-weight="600" fill="#4338ca">6–13 פעולה ארוכה · ברקע</text>
    <text x="395" y="800" text-anchor="start" font-size="14" font-weight="600" fill="#4338ca">14 תקופת המעבר</text>
    <text x="395" y="826" text-anchor="start" font-size="13" fill="#475569">Local Agent וסורק: לא בתהליך הזה</text>
    <text x="395" y="848" text-anchor="start" font-size="13" fill="#92400e">אירוח בתקופת המעבר — IIS או AWS: ⚠️ לאמת</text>
  </g>
</svg>
</div>
</body>
</html>
